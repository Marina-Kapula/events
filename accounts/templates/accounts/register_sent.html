{% extends "base.html" %}

{% block title %}Check your email · AMFI Meetups{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<main id="main" class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="card w-full max-w-sm bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title">Check your email</h1>
      <p>We sent you a link: open it to activate your account.</p>
      <p class="mt-2 text-sm">Nothing after a few minutes? <a href="{% url 'resend_verification' %}" class="link link-primary">Send it again</a>.</p>
    </div>
  </div>
</main>
{% endblock %}
