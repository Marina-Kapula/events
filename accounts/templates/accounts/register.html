{% extends "base.html" %}

{% block title %}Register · AMFI Meetups{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<main id="main" class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="card w-full max-w-sm bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title">Welcome to AMFI Meetups</h1>
      <p class="opacity-70">Fill in your profile. Other students will see your photo, name, age, nationality and gender.</p>
      <form method="post" enctype="multipart/form-data" class="django-form grid gap-2">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary mt-2">Register</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
