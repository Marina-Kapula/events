{% extends "base.html" %}

{% block title %}New event · AMFI Meetups{% endblock %}

{% block content %}
<main id="main" class="mx-auto max-w-md px-4 py-10">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title">New event</h1>
      <p class="opacity-70">AMFI checks every event before it is listed. We'll email you when it's approved.</p>
      <form method="post" enctype="multipart/form-data" class="django-form grid gap-2">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary mt-2">Send to review</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
