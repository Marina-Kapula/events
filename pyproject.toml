[project]
name = "events"
version = "0.1.0"
description = "Meetup-style events for Erasmus students hosted by AMFI International"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-countries>=9.1.0",
    "django-stubs-ext>=6.1,<6.2",
    "django-tailwind-cli>=4.8,<4.9",
    "gunicorn>=26.2,<27",
    "pillow>=13.0.0",
    "segno>=1.6.6",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1,<6.2",
    "pyrefly>=1.3,<1.4",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pyrefly]
preset = "strict"
project-excludes = ["**/migrations/**", "**/eventsVenv/**", "**/.venv/**", "**/node_modules/**"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "PT", "SIM", "RUF"]
allowed-confusables = ["–"]

[tool.ruff.format]
# Ruff 0.16 also formats Python blocks in Markdown. The spec, issues and notes hold partial
# snippets (one `path(...)` from a list, a method without its class) that it would rewrap.
exclude = ["SPEC.md", "issues/**", "docs/**"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
